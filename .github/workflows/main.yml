name: Construir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Encontrar o descomprimir el proyecto Android
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -name settings.gradle.kts -not -path '*/.gradle/*' | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
            if [ -n "$ZIP_FILE" ]; then
              echo "Proyecto comprimido encontrado: $ZIP_FILE"
              mkdir -p proyecto_extraido
              unzip -q "$ZIP_FILE" -d proyecto_extraido
              SETTINGS_FILE="$(find proyecto_extraido -name settings.gradle.kts -not -path '*/.gradle/*' | head -n 1)"
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No se encontró settings.gradle.kts ni un ZIP Android válido."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK de prueba
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RegistroLlamadas-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
