package com.jorge.registrollamadas;

import android.content.Context;

public final class SyncManager {
    private SyncManager() {}

    public static int syncPending(Context context) {
        CallDatabase db = new CallDatabase(context.getApplicationContext());
        int synced = 0;
        for (CallDatabase.PendingRecord record : db.pending()) {
            ApiClient.ApiResult result = ApiClient.post(record.payload);
            if (result.success) {
                db.markSynced(record.id);
                synced++;
            } else {
                db.markError(record.id, result.message);
            }
        }
        return synced;
    }
}
